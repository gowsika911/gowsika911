<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gowsika — Software Engineer</title>
  <desc id="desc">A dark futuristic banner with animated violet and cyan gradient waves and software engineering themed details.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090E1B"/>
      <stop offset="55%" stop-color="#11152B"/>
      <stop offset="100%" stop-color="#17102E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
      <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#A5B4FC" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#base)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="950" cy="90" rx="310" ry="190" fill="url(#orb)" filter="url(#blur)"/>
  <ellipse cx="250" cy="350" rx="280" ry="120" fill="#0891B2" opacity=".12" filter="url(#blur)"/>
  <path d="M650 360 C760 250 820 420 930 285 S1110 180 1200 245" fill="none" stroke="url(#glow)" stroke-width="3" opacity=".85">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M650 360 C760 250 820 420 930 285 S1110 180 1200 245;M650 360 C760 310 820 210 930 300 S1110 370 1200 245;M650 360 C760 250 820 420 930 285 S1110 180 1200 245"/>
  </path>
  <path d="M710 360 C810 290 860 390 980 245 S1110 230 1200 170" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity=".35"/>
  <g fill="#C4B5FD" opacity=".7">
    <circle cx="930" cy="72" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="130" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="65" r="1.8"><animate attributeName="opacity" values=".2;.9;.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="190" r="1.5"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(84 86)">
    <rect x="0" y="0" width="5" height="176" rx="2.5" fill="url(#glow)"/>
    <text x="30" y="22" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="5">HELLO, WORLD</text>
    <text x="26" y="100" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-2">I'M GOWSIKA</text>
    <text x="30" y="145" fill="#D8B4FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="2">SOFTWARE ENGINEER</text>
    <text x="30" y="181" fill="#A7B0C8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1">JAVA  /  FULL STACK DEVELOPMENT  /  PROBLEM SOLVING</text>
  </g>
  <g transform="translate(1000 255)" opacity=".7" fill="none" stroke="#A5B4FC" stroke-width="1.5">
    <rect x="0" y="0" width="112" height="58" rx="10" stroke-opacity=".35"/>
    <path d="M16 20l10 9-10 9M39 38h24" stroke="#22D3EE"/>
    <circle cx="88" cy="18" r="3" fill="#8B5CF6" stroke="none"/>
  </g>
</svg>